name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: file_migration
          POSTGRES_USER: file_migration
          POSTGRES_PASSWORD: file_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U file_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: file_migration
      DB_USER: file_migration
      DB_PASSWORD: file_migration

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Django system checks
        run: uv run python manage.py check

      - name: Fail if a model change is missing its migration
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Run unit tests
        # temporal_integration tests need a live Temporal server and are
        # excluded by default (see pytest.ini) -- see the separate
        # temporal-integration job below for those.
        run: uv run pytest -q

      - name: Lint
        run: uvx ruff check migration scripts

  temporal-integration:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: file_migration
          POSTGRES_USER: file_migration
          POSTGRES_PASSWORD: file_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U file_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: file_migration
      DB_USER: file_migration
      DB_PASSWORD: file_migration

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless --ip 127.0.0.1 --port 7233 &
          for i in $(seq 1 30); do
            temporal operator cluster health --address localhost:7233 && break
            sleep 1
          done

      - name: Run Temporal integration tests
        run: uv run pytest -m temporal_integration -q
