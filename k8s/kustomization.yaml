apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 05-config.yaml
  - 10-postgres.yaml
  - 20-temporal.yaml
  - 30-migrate-job.yaml
  - 40-worker-deployment.yaml
  # 41-worker-hpa.yaml (CPU-based) and 50-keda-scaler.yaml
  # (Temporal-backlog-based, needs KEDA installed) both scale
  # migration-worker and MUST NOT be applied together -- two
  # autoscalers targeting the same Deployment conflict. Pick one and
  # apply it on top of this base: `kubectl apply -f k8s/41-worker-hpa.yaml`
  # or `kubectl apply -f k8s/50-keda-scaler.yaml`, not both.
