# The horizontally-scalable piece: N replicas of this pod all poll the
# same Temporal task queue ("file-migration"), so more replicas means
# more parallel activity throughput -- no workflow code changes needed,
# Temporal's task queue is already a shared work queue by design.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-worker
  namespace: file-migration
spec:
  replicas: 2
  selector:
    matchLabels: {app: migration-worker}
  template:
    metadata:
      labels: {app: migration-worker}
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: file-migration-automation:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "migration.orchestration.worker"]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
