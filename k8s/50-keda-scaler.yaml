# KEDA's built-in `temporal` scaler (pkg/scalers/temporal_scaler.go) --
# no custom scaler service needed. An earlier version of this file
# shipped a hand-written gRPC ExternalScaler doing the exact same
# DescribeTaskQueue query KEDA already does natively; discovered that
# by searching for prior art (temporal-community/temporal-scaling-demo)
# after the fact, deleted the custom service, and replaced it with
# this. Requires KEDA installed in the cluster:
#   helm install keda kedacore/keda -n keda-system --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: migration-worker
  namespace: file-migration
spec:
  scaleTargetRef:
    name: migration-worker
  # 0, not 1: no pods running (and nothing polling) between migration
  # runs, scaling up the moment real backlog appears.
  minReplicaCount: 0
  maxReplicaCount: 20
  cooldownPeriod: 60
  triggers:
    - type: temporal
      metadata:
        endpoint: "temporal.file-migration.svc.cluster.local:7233"
        namespace: "default"
        taskQueue: "file-migration"
        targetQueueSize: "50"
        # Our in-cluster demo Temporal server (temporalio/auto-setup)
        # doesn't speak TLS -- a real deployment behind TLS should
        # drop this line (the scaler defaults enableTLS to true).
        enableTLS: "false"
