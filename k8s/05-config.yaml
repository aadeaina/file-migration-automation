apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: file-migration
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: file_migration
  TEMPORAL_ADDRESS: "temporal:7233"
---
# Placeholder values for a local kind/minikube demo -- replace with a
# real Secret (or better, an external-secrets/Vault-backed one) before
# using this anywhere real. Never commit actual credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: file-migration
type: Opaque
stringData:
  DB_USER: file_migration
  DB_PASSWORD: file_migration
  SLACK_WEBHOOK_URL: "https://hooks.slack.example/replace-me"
